<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Main Owl Frame and Lines -->
  <g stroke="#7b4a29" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Continuous outer ribbon: legs, top eye arcs, and beak -->
    <path d="M 18 85 L 18 35 A 16 16 0 1 1 34 51 L 50 82 L 66 51 A 16 16 0 1 1 82 35 L 82 85" />
    
    <!-- Inner bottom-left eye arc -->
    <path d="M 34 51 A 16 16 0 0 1 18 35" />
    
    <!-- Inner bottom-right eye arc -->
    <path d="M 66 51 A 16 16 0 0 0 82 35" />
    
    <!-- Audio Waveform (Right Eye) -->
    <path d="M 56 31 L 56 39 M 61 27 L 61 43 M 66 23.5 L 66 46.5 M 71 27 L 71 43 M 76 31 L 76 39" stroke-width="3" />
  </g>
  
  <!-- Solid Pupil (Left Eye) -->
